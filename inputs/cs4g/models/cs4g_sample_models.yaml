metadata:
  source: Salo+2015 S4G P4 GALFIT decompositions (IRSA cs4gcat x Comeron+2025)
  description: Multi-component mockgal models for a size-aware 300-galaxy sub-sample
    of CS4G late-type disks. Sizes in kpc, magnitudes in absolute i-band AB (predicted
    from IRAC1 via Strategy D).
  reference: Salo+2015 ApJS 219 4; Comeron+2025 A&A 697 A38; Sheth+2010 PASP 122 1397
  assumed_band: SDSS i-band AB (predicted)
  n_galaxies: 300
  sample_selection: size-aware at z=0.1 (>75 pixels), prefer complex models; see docs/plan/PLAN_CS4G_SAMPLE.md
  component_types:
    sersic: bulge or disk (expdisk converted to Sersic n=1, R_e=1.6783 R_s)
    ferrer: Salo+2015 bar profile; alpha=2, beta=0 typical
    psf: unresolved galaxy nucleus; requires PSF-enabled render
