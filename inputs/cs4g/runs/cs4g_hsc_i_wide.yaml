run_name: cs4g_hsc_i_wide
description: CS4G production-oriented run set rendering the size-aware 300-galaxy S4G sub-sample at HSC i-band wide-depth survey settings. Emits one deep clean reference plus two wide-depth redshift snapshots per galaxy.
model_file: inputs/cs4g/models/cs4g_sample_models.yaml
output_root: /Volumes/galaxy/isophote/s4g_mock

# size_factor=4.0 (vs Huang2013's 6.0): the CS4G sample's extended disk
# (n=1 Sersic) is always the max-Re component, so 4 * Re_disk captures
# 98.6% of disk flux and >99.9% of bulge/bar flux. See Phase 9 in
# docs/plan/PLAN_CS4G_SAMPLE.md for the flux-completeness derivation.
defaults:
  pixel_scale: 0.168
  zeropoint: 27.0
  size_factor: 4.0
  size_pixels: null
  max_image_size: 4001
  psf_enabled: true
  psf_type: gaussian
  psf_fwhm: 0.7
  psf_moffat_beta: 4.765
  psf_file: null
  sky_enabled: false
  sky_type: flat
  sky_level: 0.0
  sky_coeffs: [0.0]
  sky_sb_value: null
  noise_enabled: false
  noise_sigma: null
  noise_snr: null
  noise_seed: 42
  sky_sb_limit: null
  gain: null
  randomize_noise_seed: true
  engine: auto
  profit_cli_path: null

configs:
  - name: clean_z005
    redshift: 0.05
    size_factor: 4.0
    noise_enabled: true
    sky_sb_limit: 28.5

  - name: wide_z005
    redshift: 0.05
    size_factor: 4.0
    noise_enabled: true
    sky_sb_limit: 24.62395438263279

  - name: wide_z010
    redshift: 0.10
    size_factor: 4.0
    noise_enabled: true
    sky_sb_limit: 24.62395438263279
