run_name: huang2013_hsc_i_dud
description: Huang2013 production-oriented run set using HSC i-band dud depth values copied inline from the calibration summary.
model_file: inputs/huang2013/models/huang2013_models.yaml
output_root: output/huang2013_production

defaults:
  pixel_scale: 0.168
  zeropoint: 27.0
  size_pixels: null
  max_image_size: 4001
  psf_enabled: true
  psf_type: gaussian
  psf_fwhm: 0.7
  psf_moffat_beta: 4.765
  psf_file: null
  sky_enabled: false
  sky_type: flat
  sky_level: 0.0
  sky_coeffs: [0.0]
  sky_sb_value: null
  noise_enabled: false
  noise_sigma: null
  noise_snr: null
  noise_seed: 42
  sky_sb_limit: null
  gain: null
  randomize_noise_seed: false
  engine: auto
  profit_cli_path: null

configs:
  - name: z005_clean
    redshift: 0.05
    size_factor: 6.0

  - name: z005_hsc_i_dud
    redshift: 0.05
    size_factor: 6.0
    noise_enabled: true
    sky_sb_limit: 25.697653749397546

  - name: z020_hsc_i_dud
    redshift: 0.20
    size_factor: 6.0
    noise_enabled: true
    sky_sb_limit: 25.697653749397546

  - name: z050_hsc_i_dud
    redshift: 0.50
    size_factor: 6.0
    noise_enabled: true
    sky_sb_limit: 25.697653749397546
